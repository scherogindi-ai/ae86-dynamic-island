
name: Build AE86 iOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep Xcode
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project AE86DynamicIsland.xcodeproj \
            -scheme AE86App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Build for iPhone
        run: |
          xcodebuild \
            -project AE86DynamicIsland.xcodeproj \
            -scheme AE86App \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload iPhone build
        uses: actions/upload-artifact@v4
        with:
          name: AE86-iPhone-Build
          path: build-device/Build/Products/Debug-iphoneos/AE86App.app
          if-no-files-found: error
      - name: Upload built app
        uses: actions/upload-artifact@v4
        with:
          name: AE86-iOS-Simulator-App
          path: build/Build/Products/Debug-iphonesimulator/AE86App.app
          if-no-files-found: error

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: /Users/runner/Library/Logs/DiagnosticReports/

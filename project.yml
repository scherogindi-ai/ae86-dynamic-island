name: AE86DynamicIsland
options:
  bundleIdPrefix: com.example.ae86
  deploymentTarget:
    iOS: "16.2"
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  AE86App:
    type: application
    platform: iOS
    sources:
      - path: AE86App
    settings:
      base:
      GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ae86.dynamicisland
        INFOPLIST_KEY_CFBundleDisplayName: "AE86 Panda"
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
  AE86Widget:
    type: app-extension
    platform: iOS
    sources:
      - path: AE86Widget
      - path: AE86App/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ae86.dynamicisland.widget
        INFOPLIST_KEY_CFBundleDisplayName: "AE86 Live Activity"
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
